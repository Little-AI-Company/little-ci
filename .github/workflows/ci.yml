name: CI

# Work lands on main through scripts/push_main.sh, which runs these checks before it pushes
# (docs/push-main.md). This run repeats them after the push on clean GitHub-hosted machines, and
# is the only place the app tests run when the pusher had no Swift. Nothing waits for it and no
# rule requires it: a red run means whoever pushed fixes or reverts within the hour.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every commit on main gets its own run, and runs always finish.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  scripts:
    name: Scripts
    # GitHub-hosted, never a Little-CI runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check syntax
        run: bash -n ./*.sh lib/*.sh tests/*.sh app/scripts/*.sh scripts/*.sh
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck --severity=warning ./*.sh lib/*.sh tests/*.sh app/scripts/*.sh scripts/*.sh
      - name: Run tests
        run: ./tests/run.sh

  app:
    name: Menu bar app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run tests
        run: swift test --package-path app
