name: Feature request
description: Suggest a change. Check the "not planned" list in CONTRIBUTING.md first.
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should happen instead. Note any effect on isolation, credentials, or live runners.
    validations:
      required: true
